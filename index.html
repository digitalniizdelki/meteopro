const CFW=`export default {
  async fetch(req, env) {
    const cors = {'Access-Control-Allow-Origin':'*','Access-Control-Allow-Headers':'Authorization, Content-Type','Access-Control-Allow-Methods':'GET,PUT,OPTIONS'};
    if (req.method === 'OPTIONS') return new Response(null, {headers: cors});
    if (req.headers.get('Authorization') !== 'Bearer ' + env.TOKEN) return new Response('Unauthorized', {status: 401, headers: cors});
    const u = new URL(req.url), key = u.searchParams.get('key');
    if (u.searchParams.get('ping')) return new Response('{"ok":true}', {headers: cors});
    if (req.method === 'PUT') { await env.MP.put(key, await req.text()); return new Response('{"ok":true}', {headers: cors}); }
    const v = await env.MP.get(key);
    return v === null ? new Response('Not found', {status: 404, headers: cors}) : new Response(v, {headers: {...cors, 'Content-Type': 'application/json'}});
  }
}`;
